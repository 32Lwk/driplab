# DripLab — GitHub push → Cloud Run deploy
substitutions:
  _SERVICE_NAME: driplab
  _DEPLOY_REGION: asia-northeast1
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_HOSTNAME: asia-northeast1-docker.pkg.dev

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/cloud-run/Dockerfile
      - -t
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
      - -t
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
      - --region=${_DEPLOY_REGION}
      - --project=${PROJECT_ID}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet

images:
  - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: medicine-recommend
  REGION: asia-northeast1
  TRIGGER_NAME: driplab-deploy-main
  WORKLOAD_IDENTITY_PROVIDER: projects/340042923793/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions-deploy@medicine-recommend.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run Cloud Build deploy trigger
        run: |
          gcloud builds triggers run "${TRIGGER_NAME}" \
            --branch=main \
            --region="${REGION}" \
            --project="${PROJECT_ID}"
